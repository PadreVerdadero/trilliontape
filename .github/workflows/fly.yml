name: Deploy desk to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: trilliontape
    runs-on: ubuntu-latest
    concurrency:
      group: fly-trilliontape
      cancel-in-progress: false
    steps:
      - id: token
        name: Check FLY_API_TOKEN
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Skip without FLY_API_TOKEN
        if: steps.token.outputs.present != 'true'
        run: |
          echo "No FLY_API_TOKEN GitHub secret. Fly Launch UI still deploys the desk."
          echo "This Action is optional. Add the secret from: fly tokens create deploy"
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.present == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: steps.token.outputs.present == 'true'
        name: Ensure sqlite volume
        run: |
          set -euo pipefail
          NAME=trilliontape_sqlite
          REGIONS=$(flyctl machines list --app trilliontape --json | jq -r '.[].region // empty' | sort -u)
          if [ -z "$REGIONS" ]; then
            REGIONS=$(flyctl volumes list --app trilliontape --json | jq -r '.[].region // empty' | sort -u)
          fi
          if [ -z "$REGIONS" ]; then
            REGIONS=ord
          fi
          VOLS=$(flyctl volumes list --app trilliontape --json)
          for region in $REGIONS; do
            if echo "$VOLS" | jq -e --arg n "$NAME" --arg r "$region" \
              '.[] | select(.name == $n and .region == $r)' >/dev/null; then
              echo "Volume $NAME already exists in $region."
            else
              echo "Creating volume $NAME in $region."
              flyctl volumes create trilliontape_sqlite --region "$region" --size 1 --yes --app trilliontape
              VOLS=$(flyctl volumes list --app trilliontape --json)
            fi
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - if: steps.token.outputs.present == 'true'
        run: flyctl deploy --remote-only --config fly.toml --app trilliontape --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
