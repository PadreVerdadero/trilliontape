# TrillionTape desk (Next.js). Fly Launch generated this file.
# If https://trilliontape.fly.dev does not resolve, the app has no public IP:
# open https://fly.io/apps/trilliontape and allocate Shared IPv4 (and IPv6).
# Change `app` only if this name is already taken.

app = 'trilliontape'
primary_region = 'ord'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'

# Persist the local book across deploys and restarts until the data host is live.
[[mounts]]
  source = 'trilliontape_sqlite'
  destination = '/app/data'
